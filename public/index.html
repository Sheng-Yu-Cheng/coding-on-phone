<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Code">
<meta name="theme-color" content="#14161b">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="style.css">
<title>coding-on-phone</title>
</head>
<body>
<div id="app">
  <header id="bar">
    <button id="btn-menu" class="icon" aria-label="選單">☰</button>
    <div id="tabs" role="tablist">
      <button data-view="problem">題目</button>
      <button data-view="code">程式</button>
      <button data-view="tests">測試<span id="badge"></span></button>
    </div>
    <select id="lang" aria-label="語言">
      <option value="cpp">C++</option>
      <option value="c">C</option>
      <option value="py">Py</option>
    </select>
    <button id="btn-copy" aria-label="複製全部程式碼">複製</button>
    <button id="btn-run" class="primary" aria-label="執行">▶</button>
  </header>

  <main>
    <section id="view-problem" class="view" hidden>
      <h2 id="p-title"></h2>
      <div id="p-meta"></div>
      <div id="p-body"></div>
    </section>

    <section id="view-code" class="view">
      <div id="editor"></div>
      <div id="status" hidden></div>
      <button id="kb-show" aria-label="顯示鍵盤" hidden>⌨</button>
    </section>

    <section id="view-tests" class="view" hidden>
      <div id="t-summary"></div>
      <pre id="t-compile" hidden></pre>
      <div id="t-list"></div>
      <button id="t-add" class="wide">＋ 新增測試</button>
    </section>
  </main>

  <div id="kb" hidden>
    <div id="strip">
      <div id="tools">
        <button data-tool="hide" aria-label="收起鍵盤">⌨⇣</button>
        <button data-tool="undo" aria-label="復原">↶</button>
        <button data-tool="redo" aria-label="重做">↷</button>
        <button data-tool="expand">擴選</button>
        <button data-tool="shrink">縮選</button>
        <button data-tool="line">選行</button>
        <button data-tool="copy">複製</button>
        <button data-tool="cut">剪下</button>
        <button data-tool="paste">貼上</button>
        <button data-tool="comment">//</button>
        <button data-tool="dup">複製行</button>
        <button data-tool="snips">片段</button>
      </div>
      <div id="chips" hidden></div>
    </div>
    <div id="keys"></div>
  </div>
</div>

<div id="sheet" hidden>
  <div id="sheet-card">
    <div id="sheet-head"><b id="sheet-title"></b><button id="sheet-close" class="icon" aria-label="關閉">✕</button></div>
    <div id="sheet-body"></div>
  </div>
</div>
<div id="toast" hidden></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
